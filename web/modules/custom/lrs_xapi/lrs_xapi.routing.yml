lrs_xapi.endpoint.activities:
  path: '/lrs/endpoint/activities/{statement_type}'
  defaults:
    _controller: '\Drupal\lrs_xapi\Controller\LrsXapiEndpoint::activities'
    _title: 'LRS Endpoint - Activities'
    statement_type: '_default'
  requirements:
    _access: 'TRUE'
  methods:
    - GET
    - PUT
    - POST
    - DELETE
  options:
    parameters:
      statement_type:
        type: string

lrs_xapi.endpoint.statements:
  path: '/lrs/endpoint/statements/{statement_type}'
  defaults:
    _controller: '\Drupal\lrs_xapi\Controller\LrsXapiEndpoint::statements'
    _title: 'LRS Endpoint - Statements'
    statement_type: '_default'
  requirements:
    _access: 'TRUE'
  methods:
    - GET
    - PUT
    - POST
    - DELETE
  options:
    parameters:
      statement_type:
        type: string
